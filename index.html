<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Find the best anime that aired in a selected year, filtered by genre, format, status and number of ratings."
    />
    <meta name="theme-color" content="#2e4260" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Airing Year — Anime Finder" />
    <meta
      property="og:description"
      content="Explore the best anime that aired in a selected year using AniList data."
    />
    <meta property="og:url" content="https://mark-can.github.io/anime-finder/" />
    <link rel="canonical" href="https://mark-can.github.io/anime-finder/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>Airing Year — Anime Finder</title>
  </head>
  <body>
    <a class="skip-link" href="#results">Skip to results</a>

    <main class="page-shell">
      <header class="site-header">
        <div class="site-heading">
          <p class="eyebrow">AniList archive</p>
          <h1 id="app-title">Airing Year</h1>
          <p id="tagline" class="tagline">
            The best anime of a given year by genre — including shows that started earlier and kept airing.
          </p>
        </div>

        <div class="language-switch" role="group" aria-label="Language">
          <button id="lang-en" class="language-button" type="button" lang="en" aria-pressed="true">EN</button>
          <button id="lang-ru" class="language-button" type="button" lang="ru" aria-pressed="false">RU</button>
        </div>
      </header>

      <form id="filters" class="filter-panel">
        <div class="field">
          <label id="year-label" for="year">Year</label>
          <div class="select-wrap">
            <select id="year" name="year"></select>
          </div>
        </div>

        <div class="field">
          <label id="genre-label" for="genre">Genre</label>
          <div class="select-wrap">
            <select id="genre" name="genre"></select>
          </div>
        </div>

        <div class="field">
          <label id="ratings-label" for="min-ratings">Minimum ratings</label>
          <div class="select-wrap">
            <select id="min-ratings" name="minRatings"></select>
          </div>
        </div>

        <div class="field">
          <label id="status-label" for="airing-status">Airing status</label>
          <div class="select-wrap">
            <select id="airing-status" name="status"></select>
          </div>
        </div>

        <div class="field">
          <label id="sort-label" for="sort">Sort by</label>
          <div class="select-wrap">
            <select id="sort" name="sort"></select>
          </div>
        </div>

        <fieldset class="format-field">
          <legend id="formats-label">Formats</legend>
          <div id="format-options" class="format-options"></div>
        </fieldset>

        <div class="form-actions">
          <button id="submit-button" class="primary-button" type="submit">Show results</button>
          <p id="ranking-hint" class="ranking-hint">Top 50 by AniList score</p>
        </div>
      </form>

      <div id="status-message" class="status-message" role="status" aria-live="polite" hidden></div>

      <section id="results" class="results" aria-labelledby="results-title" hidden>
        <div class="results-heading">
          <h2 id="results-title" tabindex="-1"></h2>
          <p id="results-count"></p>
        </div>
        <ol id="result-list" class="result-list"></ol>
      </section>

      <footer id="footer" class="site-footer">
        Data from <a href="https://anilist.co" target="_blank" rel="noopener noreferrer">AniList</a>.
        Scores are rescaled to 10. “Ratings” means the number of people who actually submitted a score.
      </footer>
    </main>

    <noscript>
      <p class="noscript-message">This page requires JavaScript to query AniList.</p>
    </noscript>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
