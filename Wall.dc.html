<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стена — лучшее аниме 2024</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@600;800;900&amp;family=Sofia+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFD9D6}
</style>
</helmet>
<div style="width: 1440px; height: 1400px; box-sizing: border-box; background: #FFFFFF; color: #000000; font-family: 'Sofia Sans', sans-serif; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 28px 36px 26px">
<form aria-label="Фильтры" style="margin: 0; font-family: 'Sofia Sans Extra Condensed'; font-weight: 800; font-size: 64px; line-height: 1.05; letter-spacing: -0.5px">
<span>Лучшее</span>
<button type="button" style="border: 0; background: none; padding: 0; font: inherit; color: #D7261E; text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 8px; cursor: pointer">аниме-сериалы</button>
<span>за</span>
<button type="button" style="border: 0; background: none; padding: 0; font: inherit; color: #D7261E; text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 8px; cursor: pointer">2024</button>
<span>год,</span>
<button type="button" style="border: 0; background: none; padding: 0; font: inherit; color: #D7261E; text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 8px; cursor: pointer">все жанры</button><span>,</span>
<span>кроме</span>
<button type="button" style="border: 0; background: none; padding: 0; font: inherit; color: #D7261E; text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 8px; cursor: pointer">того, что я уже видел</button>
</form>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px; flex: none">
<div style="display: flex; gap: 6px">
<button type="button" style="height: 44px; min-width: 52px; border: 2px solid #000; border-radius: 22px; background: #FFF; font: 700 15px 'Sofia Sans'; cursor: pointer">EN</button>
<button type="button" aria-pressed="true" style="height: 44px; min-width: 52px; border: 2px solid #000; border-radius: 22px; background: #000; color: #FFF; font: 700 15px 'Sofia Sans'; cursor: pointer">RU</button>
</div>
<p style="margin: 0; font-size: 14px; color: #444; text-align: right; line-height: 1.45">Площадь — сколько людей добавили тайтл в список.<br>Печать — средняя оценка на AniList.</p>
</div>
</header>

<main style="flex-grow: 1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 0 6px 6px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="10">
<a href="#" style="{{t.cell}}">
<img src="{{t.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.78) 100%)"></span>
<span style="{{t.seal}}"><span style="{{t.sealScore}}">{{t.score}}</span></span>
<span style="position: absolute; left: 14px; top: 10px; font-family: 'Sofia Sans Extra Condensed'; font-weight: 900; font-size: 28px; color: #FFFFFF; text-shadow: 0 1px 8px rgba(0,0,0,0.55)">{{t.rank}}</span>
<span style="position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; flex-direction: column; gap: 2px">
<span style="{{t.titleStyle}}">{{t.title}}</span>
<span style="font-size: 13px; color: #E8E8E8">{{t.meta}}</span>
</span>
</a>
</sc-for>
<a href="#" style="grid-column: 5 / span 3; grid-row: 5; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #D7261E; color: #FFFFFF; text-decoration: none">
<span style="font-family: 'Sofia Sans Extra Condensed'; font-weight: 900; font-size: 54px; line-height: 1">Ещё 64</span>
<span style="font-size: 16px; font-weight: 600; text-align: right; line-height: 1.35">от 5 000 оценок,<br>отсортировано по оценке</span>
</a>
</main>
</div>
</x-dc>

</script>
</body>
</html>
