<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The best anime of any year as a card collection: every title gets a rarity from UR to C by its AniList score."
    />
    <meta name="theme-color" content="#3b2a8f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Anime by Year — the best anime of any year" />
    <meta
      property="og:description"
      content="Explore the highest-rated anime of any year as a card collection, using AniList data."
    />
    <meta property="og:url" content="https://mark-can.github.io/anime-finder/" />
    <link rel="canonical" href="https://mark-can.github.io/anime-finder/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Anime by Year — the best anime of any year</title>
  </head>
  <body>
    <a class="skip-link" href="#results">Skip to results</a>

    <div class="page">
      <header class="topbar">
        <h1 id="app-title" class="brand">Anime by Year</h1>
        <div class="topbar-actions">
          <button id="collector" class="collector" type="button" aria-haspopup="dialog">
            <span class="collector-avatar" aria-hidden="true"></span>
            <span id="collector-name" class="collector-name"></span>
            <span id="collector-count" class="collector-count"></span>
          </button>
          <div class="language-switch" role="group" aria-label="Language">
            <button id="lang-en" class="language-button" type="button" lang="en" aria-pressed="true">EN</button>
            <button id="lang-ru" class="language-button" type="button" lang="ru" aria-pressed="false">RU</button>
          </div>
        </div>
      </header>

      <form id="filters" class="controls" novalidate>
        <div class="period-row">
          <div class="year-stepper">
            <button id="year-prev" class="round-button" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" /></svg>
            </button>
            <label id="year-label" class="visually-hidden" for="year">Year</label>
            <select id="year" name="year" class="year-select"></select>
            <button id="year-next" class="round-button" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4 6 6-6 6" /></svg>
            </button>
          </div>
          <div id="season-options" class="season-tabs" role="group" aria-labelledby="season-label">
            <span id="season-label" class="visually-hidden">Season</span>
          </div>
        </div>

        <div class="chip-row">
          <div id="genre-options" class="chips" role="group" aria-labelledby="genre-label">
            <span id="genre-label" class="visually-hidden">Genres</span>
          </div>
          <div class="chip-row-actions">
            <div id="filter-summary" class="filter-summary"></div>
            <button id="unowned-toggle" class="chip chip-gold" type="button" aria-pressed="false" hidden></button>
            <button id="open-filters" class="chip chip-solid" type="button" aria-haspopup="dialog">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M6 10h8M8.5 15h3" /></svg>
              <span id="open-filters-label">Filters</span>
              <span id="filter-count" class="chip-count" hidden></span>
            </button>
          </div>
        </div>
        <p id="genre-hint" class="hint"></p>

        <dialog id="filters-panel" class="sheet" aria-labelledby="filters-title">
          <div class="sheet-head">
            <h2 id="filters-title">All filters</h2>
            <button id="filters-close" class="round-button round-button-light" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" /></svg>
            </button>
          </div>

          <div class="sheet-body">
            <fieldset id="user-section" class="sheet-section">
              <legend id="user-label">Your AniList list</legend>
              <div class="user-controls">
                <label id="user-name-label" class="visually-hidden" for="user-name">AniList username</label>
                <input id="user-name" class="text-input" type="text" autocomplete="username" spellcheck="false" maxlength="40" />
                <button id="user-load" class="pill-button" type="button">Load list</button>
                <button id="user-forget" class="link-button" type="button" hidden>Forget</button>
              </div>
              <label id="hide-mode-label" class="field-label" for="hide-mode">Titles on your list</label>
              <div class="select-wrap">
                <select id="hide-mode"></select>
              </div>
              <p id="user-status" class="hint" role="status" aria-live="polite"></p>
            </fieldset>

            <fieldset class="sheet-section">
              <legend id="tags-label">Tags</legend>
              <div class="tag-entry">
                <input id="tag-input" class="text-input" type="text" list="tag-list" autocomplete="off" spellcheck="false" aria-describedby="tag-hint" />
                <button id="tag-add" class="pill-button" type="button">Add</button>
              </div>
              <datalist id="tag-list"></datalist>
              <div id="tag-chips" class="chips"></div>
              <label id="tag-rank-label" class="field-label" for="tag-rank">Tag relevance</label>
              <div class="select-wrap">
                <select id="tag-rank" name="tagRank"></select>
              </div>
              <p id="tag-hint" class="hint"></p>
            </fieldset>

            <fieldset class="sheet-section">
              <legend id="formats-label">Formats</legend>
              <div id="format-options" class="chips"></div>
              <label class="check-option">
                <input id="first-seasons" type="checkbox" name="firstSeasons" aria-describedby="first-seasons-hint" />
                <span id="first-seasons-label">First seasons only</span>
              </label>
              <p id="first-seasons-hint" class="hint"></p>
            </fieldset>

            <div class="sheet-section sheet-grid">
              <div class="field">
                <label id="country-label" class="field-label" for="country">Country</label>
                <div class="select-wrap"><select id="country" name="country"></select></div>
              </div>
              <div class="field">
                <label id="ratings-label" class="field-label" for="min-ratings">Minimum ratings</label>
                <div class="select-wrap"><select id="min-ratings" name="minRatings"></select></div>
              </div>
              <div class="field">
                <label id="status-label" class="field-label" for="airing-status">Airing status</label>
                <div class="select-wrap"><select id="airing-status" name="status"></select></div>
              </div>
              <div class="field">
                <label id="sort-label" class="field-label" for="sort">Sort by</label>
                <div class="select-wrap"><select id="sort" name="sort"></select></div>
              </div>
              <div class="field">
                <label id="limit-label" class="field-label" for="limit">Results shown</label>
                <div class="select-wrap"><select id="limit" name="limit"></select></div>
              </div>
            </div>
          </div>

          <div class="sheet-foot">
            <button id="filters-reset" class="link-button" type="button">Reset</button>
            <button id="filters-done" class="pill-button pill-button-gold" type="button">Done</button>
          </div>
        </dialog>
      </form>

      <div id="status-message" class="status-message" role="status" aria-live="polite" hidden></div>

      <main id="results" class="results" aria-labelledby="results-title" tabindex="-1" hidden>
        <section class="hero" aria-labelledby="results-title">
          <div class="hero-copy">
            <h2 id="results-title" class="hero-title" tabindex="-1"></h2>
            <p id="results-genre" class="hero-genre"></p>
            <p id="results-lead" class="hero-lead"></p>
            <div id="rarity-bar" class="rarity-bar" aria-hidden="true"></div>
            <ul id="rarity-legend" class="rarity-legend"></ul>
            <p id="results-count" class="hero-count"></p>
          </div>
          <ol id="podium" class="podium"></ol>
        </section>
        <div id="sections" class="sections"></div>
      </main>

      <footer id="footer" class="site-footer"></footer>
    </div>

    <dialog id="detail" class="detail" aria-labelledby="detail-title"></dialog>

    <noscript>
      <p class="noscript-message">This page requires JavaScript to query AniList.</p>
    </noscript>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
